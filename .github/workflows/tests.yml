#
# Every test file, plus the front-end parity check and the manifest load.
#
# Windows because the toolkit is a Windows toolkit, but note what this does NOT
# prove: no test here mounts an image, calls DISM, touches the registry or
# reaches the network -- by design, so they run in seconds and anywhere. What CI
# guards is the mechanical half: parity between the two front-ends, script
# ordering, GUI layout and timer behaviour, generated script shapes, and the
# documentation matching the code.
#
# Both shells are run. Windows PowerShell 5.1 is what the module actually targets
# and what the launchers start; pwsh 7 is what most contributors have to hand. A
# test that passes in one and fails in the other is worth knowing about, so
# neither is allowed to hide the other, and neither cancels the other.
#
# Two jobs rather than one matrix, deliberately. A step's `shell:` key is one of
# the few workflow keys that accepts no expression, so `shell: ${{ matrix.shell }}`
# does not fail at run time -- GitHub refuses the whole file with "Unrecognized
# named-value: 'matrix'" and no job starts at all. The suite therefore lives in
# tests/Invoke-CiSuite.ps1, which both jobs call with a literal shell name, and
# which is also the one command to run the suite locally.

name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run the suite
        shell: powershell
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'suite.log'
          cmd.exe /c "powershell.exe -NoProfile -File .\tests\Invoke-CiSuite.ps1 > `"$log`" 2>&1"
          $code = $LASTEXITCODE
          Get-Content -LiteralPath $log -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) { exit $code }

  pwsh:
    name: PowerShell 7
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run the suite
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'suite.log'
          cmd.exe /c "pwsh.exe -NoProfile -File .\tests\Invoke-CiSuite.ps1 > `"$log`" 2>&1"
          $code = $LASTEXITCODE
          Get-Content -LiteralPath $log -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) { exit $code }
