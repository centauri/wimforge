#
# Every test file, plus the front-end parity check.
#
# Windows because the toolkit is a Windows toolkit, but note what this does NOT
# prove: no test here mounts an image, calls DISM, touches the registry or
# reaches the network -- by design, so they run in seconds and anywhere. What CI
# guards is the mechanical half: parity between the two front-ends, script
# ordering, GUI layout and timer behaviour, generated script shapes, and the
# documentation matching the code.
#
# Both shells are run. Windows PowerShell 5.1 is what the module actually targets
# and what the launchers start; pwsh 7 is what most contributors have to hand. A
# test that passes in one and fails in the other is worth knowing about, so
# neither is allowed to hide the other.

name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.shell }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [ powershell, pwsh ]

    steps:
      - uses: actions/checkout@v4

      - name: Show the shell being used
        shell: ${{ matrix.shell }}
        run: $PSVersionTable | Format-List

      - name: Test files
        shell: ${{ matrix.shell }}
        run: |
          $failed = @()
          foreach ($t in Get-ChildItem tests\Test-*.ps1 | Sort-Object Name) {
              Write-Host ""
              Write-Host "=== $($t.Name) ===" -ForegroundColor Cyan
              & $t.FullName
              # A test file reports by exit code. Collected rather than thrown on,
              # so one failure does not hide the other forty.
              if ($LASTEXITCODE -ne 0) { $failed += $t.Name }
          }
          Write-Host ""
          if ($failed.Count -gt 0) {
              Write-Host ("FAILED: {0}" -f ($failed -join ', ')) -ForegroundColor Red
              exit 1
          }
          Write-Host "All test files passed." -ForegroundColor Green

      - name: Front-end parity
        shell: ${{ matrix.shell }}
        run: |
          # Parameter differences are reported but do not fail the build: one
          # front-end legitimately prompts for a value the other defaults.
          .\Test-FrontEndParity.ps1 -AllowParameterDifferences

      - name: Manifest is loadable and its exports exist
        shell: ${{ matrix.shell }}
        run: |
          $m = Import-PowerShellDataFile .\WimForge\WimForge.psd1
          Write-Host ("manifest exports {0} function(s)" -f $m.FunctionsToExport.Count)
          if ($m.FunctionsToExport.Count -lt 1) { throw 'The manifest exports nothing.' }
